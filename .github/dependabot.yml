version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # typescript-eslint supports TypeScript <7. TS 7 breaks lint
      # (reads removed compiler internals), so hold the 6.x line until
      # the toolchain supports it. See PR #69.
      - dependency-name: "typescript"
        versions:
          - ">=7"
    groups:
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      dev-major:
        dependency-type: "development"
        update-types:
          - "major"
        patterns:
          - "*"
      prod-major:
        dependency-type: "production"
        update-types:
          - "major"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
