name: Integration

# Runs when a (draft) release is published, and by hand: the suite needs a
# live Foundry server per version and takes several minutes, so it checks
# what ships rather than every push. A release runs under its tag and can
# only restore caches saved under that tag or on main, so after a new
# Foundry release run this once by hand on main: it downloads each build
# once and fills the caches later release runs restore.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # module.json supports Foundry 13 and 14: test the newest of each.
        foundry: [latest-13, latest-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # package-lock.json records the Foundry type definitions' pixi git
      # dependencies with SSH URLs; the runner has no SSH key, so use HTTPS.
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build module
        run: npm run build

      - name: Resolve Foundry version
        id: foundry
        run: echo "version=$(npx foundry-test resolve ${{ matrix.foundry }})" >> "$GITHUB_OUTPUT"

      # The Foundry build depends only on the version: cache it on its own
      # so it is downloaded from foundryvtt.com once per version (several
      # downloads at once get rate limited). The seeded worlds, with PF2e and
      # SF2e installed, are cached by version and config.
      - name: Cache Foundry build
        uses: actions/cache@v6
        with:
          path: |
            .foundry-test/cache/FoundryVTT-Node-${{ steps.foundry.outputs.version }}.zip
            .foundry-test/versions/${{ steps.foundry.outputs.version }}
          key: foundry-build-${{ steps.foundry.outputs.version }}

      - name: Cache seeded worlds
        uses: actions/cache@v6
        with:
          path: .foundry-test/Data-test-${{ steps.foundry.outputs.version }}
          key: foundry-data-${{ steps.foundry.outputs.version }}-${{ hashFiles('foundry-test.config.json') }}

      - name: Integration tests
        run: npx foundry-test test run --all-worlds --version ${{ steps.foundry.outputs.version }}
        env:
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}

      - name: Integration coverage
        if: always()
        run: npx foundry-test-coverage

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ steps.foundry.outputs.version }}
          path: test-results/
          retention-days: 7

      # Caches are saved after the last step. The license is tied to this
      # runner, so a restored copy is useless (the kit re-licenses), and
      # leaving it out keeps it from anyone who can read the cache.
      - name: Remove license before caching
        if: always()
        run: rm -f .foundry-test/Data-test-*/Config/license.json
